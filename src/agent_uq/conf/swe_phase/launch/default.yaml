output_dir: ${output_dir}/launch
python_executable: python
run_module: sweagent.run.run
num_workers: 1
model:
  name: ''
  backend: vllm
  tokenizer_path: ''
  chat_template_kwargs: {}
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.95
  trust_remote_code: true
sampling:
  temperature: 0.7
  top_p: 0.95
  top_k:
  max_output_tokens: 2048
candidate_sampling:
  num_candidates: 15
  max_retry_candidates:
agent:
  max_steps: 60
deployment:
  python_standalone_dir: ''
extra_args: []
